[package]
name = "z80-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust Z80 instruction core transcribed from, and proven equivalent to, z80-python"
license = "MIT"
repository = "https://github.com/alewman/z80-rust"
publish = false

[lib]
name = "z80_rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
